# Talos 1.14 node identity: select the Hetzner private address for kubelet.
# KubeNodeConfig owns nodeIP in the split-document format; do not also write the
# deprecated machine.kubelet.nodeIP field or configuration merging will fail.
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 10.26.0.0/24
