# Kubernetes API server certificate SANs for tunneled access: kubectl reaches the
# API through `cloudflared access tcp` (a local 127.0.0.1 proxy) and the public
# hostname k8s.hero-rehab.xyz. Additive — Talos still injects the cluster
# endpoint, kubernetes.default.*, and node IPs automatically.
cluster:
  apiServer:
    certSANs:
      - 127.0.0.1
      - localhost
      - k8s.hero-rehab.xyz
