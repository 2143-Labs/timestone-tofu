# Kubernetes API serving certificate SANs for Cloudflare Access. The operator
# reaches the API through a local cloudflared TCP listener; Talos additionally
# injects the private load-balancer endpoint, Kubernetes service names, node
# addresses and hostnames automatically.
apiVersion: v1alpha1
kind: KubeAPIServerConfig
certExtraSANs:
  - 127.0.0.1
  - localhost
  - k8s.hero-rehab.xyz
