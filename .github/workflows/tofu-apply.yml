name: tofu apply (safety-pinned to manual validation)

# Migration safety gate: auto-apply is DISABLED. This workflow no longer runs on
# push and no longer applies either root. It remains as a manual validation hook
# only (fmt + validate with a backend-disabled init, no live credentials needed).
# Live infra mutation during the Talos migration happens exclusively through
# the guarded `bin/cluster.py` entrypoint from an operator machine.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dir: [hetzner, cloudflare]
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.6
      - name: fmt check
        working-directory: ${{ matrix.dir }}
        run: tofu fmt -check -recursive
      - name: validate (backend-disabled)
        working-directory: ${{ matrix.dir }}
        run: |
          tofu init -backend=false -input=false -no-color
          tofu validate -no-color
